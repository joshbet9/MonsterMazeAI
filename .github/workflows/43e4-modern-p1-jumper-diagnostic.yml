name: Diagnostic — 43e4 Modern P1 Jumper

on:
  push:
    branches:
      - diagnostic/43e4-modern-p1-jumper-v1

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Modern P1 Jumper diagnostic
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=1             -DmatrixKit=JUMPER             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 43e4-modern-p1-jumper-diagnostic
          path: diagnostic.log
