name: Minecraft 1.8.9 Adapter CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  adapter:
    name: Minecraft 1.8.9 Forge adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java 8-compatible shared API
        run: mvn -B -ntp -pl common-api -am package -DskipTests

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Resolve ForgeGradle workspace
        working-directory: minecraft-1.8
        run: gradle --no-daemon setupCIWorkspace

      - name: Build and test adapter
        working-directory: minecraft-1.8
        run: gradle --no-daemon build
