name: Minecraft 1.8.9 Adapter CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/first-pad-movement, feature/first-pad-movement-v2, fix/live-f7-human-recorder ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Minecraft 1.8.9 Forge adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java 17 common runtime sidecar
        run: mvn -B -ntp -pl common -am package -DskipTests

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Resolve ForgeGradle workspace
        working-directory: minecraft-1.8
        run: gradle --no-daemon setupCIWorkspace

      - name: Build and test adapter
        working-directory: minecraft-1.8
        run: gradle --no-daemon build

      - name: Publish playable 1.8.9 mod
        uses: actions/upload-artifact@v4
        with:
          name: monster-maze-ai-1.8.9-live-f7
          path: minecraft-1.8/build/libs/monster-maze-ai-1.8-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
