name: Experiment — adaptive threat horizon v2 mixed validation

on:
  push:
    branches:
      - experiment/adaptive-threat-horizon-v2

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run mixed validation
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=AdaptiveThreatHorizonV2IT#mixedCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee adaptive-v2.log
          grep -E '^(ADAPTV2_MATRIX|ADAPTV2_MEAN)' adaptive-v2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-v2
          path: adaptive-v2.log
