name: Experiment — adaptive threat horizon v3 unified compute

on:
  push:
    branches:
      - experiment/adaptive-threat-horizon-v3

permissions:
  contents: read

jobs:
  mixed:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run mixed validation
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=AdaptiveThreatHorizonV2IT#mixedCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee adaptive-v3.log
          grep -E '^(ADAPTV2_MATRIX|ADAPTV2_MEAN)' adaptive-v3.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-v3
          path: adaptive-v3.log
