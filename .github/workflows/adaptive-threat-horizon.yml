name: Experiment — adaptive threat tactical horizon

on:
  push:
    branches:
      - experiment/adaptive-threat-horizon-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run mixed cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=AdaptiveThreatHorizonIT#mixedWeakAndStrongCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee adaptive-horizon.log
          grep -E '^(ADAPT_MATRIX|ADAPT_MEAN)' adaptive-horizon.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-horizon
          path: adaptive-horizon.log
