name: Diagnostic — best Modern P3 Maverick

on:
  push:
    branches:
      - diagnostic/best-modern-p3-maverick-v1

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run diagnostic
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=3             -DmatrixKit=MAVERICK             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee best-p3-maverick.log
      - name: Extract summary
        run: |
          grep -E '^(FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' best-p3-maverick.log > best-p3-maverick-summary.txt || true
          grep -E 'MOB_|GAP_|PAD_|FALL_|ROUTE_|NO_PHYSICAL_SUPPORT' best-p3-maverick.log | head -300 > best-p3-maverick-events.txt || true
          cat best-p3-maverick-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: best-modern-p3-maverick
          path: |
            best-p3-maverick-summary.txt
            best-p3-maverick-events.txt
