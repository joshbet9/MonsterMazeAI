name: Diagnostic — combo Modern P1 Maverick

on:
  push:
    branches:
      - diagnostic/combo-modern-p1-maverick-v1

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run diagnostic
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=1             -DmatrixKit=MAVERICK             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee combo-maverick.log
      - name: Extract key trace
        run: |
          grep -E '^(FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' combo-maverick.log > combo-maverick-summary.txt || true
          grep -E 'MOB_|GAP_|PAD_|FALL_|NO_PHYSICAL_SUPPORT|ROUTE_' combo-maverick.log | head -250 > combo-maverick-events.txt || true
          cat combo-maverick-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combo-modern-p1-maverick
          path: |
            combo-maverick-summary.txt
            combo-maverick-events.txt
