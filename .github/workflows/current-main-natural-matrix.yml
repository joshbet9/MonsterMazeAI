name: Current main — full natural-end matrix

on:
  push:
    branches:
      - benchmark/main-natural-matrix-v1

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run full natural-end matrix
        shell: bash
        run: |
          set -o pipefail
          : > natural-main.log
          mvn -B -ntp -pl common -am             -Dtest=NaturalEndMatrixMainBaselineIT#fullNaturalEndMatrix             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee natural-main.log
      - name: Summarize matrix
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("natural-main.log").read_text(encoding="utf-8",errors="replace")
          rows=[(m.group(1),int(m.group(2)),m.group(3),int(m.group(4)),int(m.group(5)),float(m.group(6)))
                for m in re.finditer(r"FULL_MATRIX mode=(SPEED|MODERN) pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+) health=([-0-9.]+)",t)]
          if len(rows)!=30: raise SystemExit(f"expected 30 rows, got {len(rows)}")
          lines=[f"{a} P{b} {c} stage={d} ticks={e} health={f:.2f}" for a,b,c,d,e,f in rows]
          speed=[r[3] for r in rows if r[0]=="SPEED"]; modern=[r[3] for r in rows if r[0]=="MODERN"]
          lines += ["",
                    f"Speed mean={sum(speed)/len(speed):.4f} min={min(speed)} max={max(speed)} >=10={sum(x>=10 for x in speed)}/15 >=70={sum(x>=70 for x in speed)}/15",
                    f"Modern mean={sum(modern)/len(modern):.4f} min={min(modern)} max={max(modern)} >=10={sum(x>=10 for x in modern)}/15 >=40={sum(x>=40 for x in modern)}/15"]
          Path("natural-main-report.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Persist matrix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add natural-main-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record current-main natural-end matrix [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-natural-matrix
          path: natural-main.log
