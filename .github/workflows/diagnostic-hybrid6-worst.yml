name: Diagnostic — hybrid baseline worst Modern cells

on:
  push:
    branches:
      - diagnostic/hybrid6-worst-modern-v1

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run worst-cell diagnostics
        shell: bash
        run: |
          set -o pipefail
          : > hybrid-worst.log
          for spec in "1 SLOWBALLER" "1 REPULSOR" "2 MAVERICK" "3 BODY_BUILDER"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a hybrid-worst.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a hybrid-worst.log
          done
      - name: Extract summary
        run: |
          grep -E '^(=====|FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' hybrid-worst.log > hybrid-worst-summary.txt || true
          cat hybrid-worst-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-worst-diagnostics
          path: |
            hybrid-worst-summary.txt
            hybrid-worst.log
