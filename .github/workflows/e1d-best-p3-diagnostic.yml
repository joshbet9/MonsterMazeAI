name: Diagnostic — e1d best P3 Modern traces

on:
  push:
    branches:
      - diagnostic/e1d-best-p3-v1

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run P3 Maverick
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=3             -DmatrixKit=MAVERICK             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee p3-maverick.log
      - name: Run P3 Jumper
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=3             -DmatrixKit=JUMPER             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee p3-jumper.log
      - name: Extract summaries
        run: |
          grep -E '^(FIRST_FALL|DIAGNOSTIC|FULL_MATRIX)' p3-maverick.log > p3-maverick-summary.txt || true
          grep -E '^(FIRST_FALL|DIAGNOSTIC|FULL_MATRIX)' p3-jumper.log > p3-jumper-summary.txt || true
          cat p3-maverick-summary.txt
          cat p3-jumper-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1d-best-p3-traces
          path: |
            p3-maverick.log
            p3-maverick-summary.txt
            p3-jumper.log
            p3-jumper-summary.txt
