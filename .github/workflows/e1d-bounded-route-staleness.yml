name: Experiment — e1d bounded route staleness

on:
  push:
    branches:
      - experiment/e1d-bounded-route-staleness-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run difficult cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=E1dBoundedRouteStalenessIT#difficultCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee stale4.log
          grep -E '^(STALE4_MATRIX|STALE4_MEAN)' stale4.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1d-stale4
          path: stale4.log
