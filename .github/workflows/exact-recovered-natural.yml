name: Benchmark — exact recovered natural-end matrix

on:
  push:
    branches:
      - benchmark/exact-recovered-natural-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-case:
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [SPEED, MODERN]
        pattern: [1, 2, 3]
        kit: [JUMPER, SLOWBALLER, BODY_BUILDER, REPULSOR, MAVERICK]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run exact recovered natural cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=${{ matrix.mode }}             -DmatrixPattern=${{ matrix.pattern }}             -DmatrixKit=${{ matrix.kit }}             -DmatrixSpawnMonsters=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee matrix-cell.log

      - name: Extract row
        run: |
          grep 'FULL_MATRIX ' matrix-cell.log | tail -1 > matrix-row.txt
          test -s matrix-row.txt
          cat matrix-row.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-natural-row-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: matrix-row.txt

  aggregate:
    name: Aggregate exact recovered natural matrix
    needs: matrix-case
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exact-natural-row-*
          path: matrix-results
          merge-multiple: false

      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          rx=re.compile(
              r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)"
          )
          rows=[]
          for p in Path("matrix-results").glob("**/matrix-row.txt"):
              m=rx.search(p.read_text(encoding="utf-8",errors="replace"))
              if m:
                  rows.append({
                      "mode":m.group(1),"pattern":int(m.group(2)),"kit":m.group(3),
                      "stage":int(m.group(4)),"ticks":int(m.group(5)),"health":float(m.group(6))
                  })
          rows.sort(key=lambda r:(r["mode"],r["pattern"],r["kit"]))
          if len(rows)!=30:
              raise SystemExit(f"expected 30 rows, got {len(rows)}")
          sp=[r["stage"] for r in rows if r["mode"]=="SPEED"]
          mo=[r["stage"] for r in rows if r["mode"]=="MODERN"]
          summary={
              "cases":30,
              "stageSum":sum(r["stage"] for r in rows),
              "speedMean":sum(sp)/15,
              "modernMean":sum(mo)/15,
              "speedPeak":max(sp),
              "modernPeak":max(mo),
              "speedAtLeast70":sum(x>=70 for x in sp),
              "modernAtLeast40":sum(x>=40 for x in mo),
              "naturalSafetyCapTicks":60000,
              "rows":rows
          }
          Path("exact-recovered-natural-matrix.json").write_text(
              json.dumps(summary,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in summary.items() if k!="rows"},indent=2))
          for r in rows:
              print(f'{r["mode"]} P{r["pattern"]} {r["kit"]}: stage={r["stage"]} ticks={r["ticks"]} health={r["health"]:.2f}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-recovered-natural-summary
          path: exact-recovered-natural-matrix.json
