name: Experiment — current-main BeamSearch mob hybrid

on:
  push:
    branches:
      - experiment/main-beam-mob-v1

permissions:
  contents: read

jobs:
  beam:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run representative Beam hybrid
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=BeamMobMatrixIT#representativeModernCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee beam-mob.log
          grep -E '^(BEAM_MATRIX|BEAM_MODERN_MEAN)' beam-mob.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beam-mob-results
          path: beam-mob.log
