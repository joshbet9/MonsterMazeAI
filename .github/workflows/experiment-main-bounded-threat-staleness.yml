name: Experiment — current-main bounded threat staleness

on:
  push:
    branches:
      - experiment/main-bounded-threat-staleness-v1

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run ten Modern cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=BoundedThreatStalenessIT#modernNaturalEndTenCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee bounded-threat.log
          grep -E '^(STALE_MATRIX|STALE_MODERN_MEAN)' bounded-threat.log
      - name: Persist compact result
        run: |
          grep -E '^(STALE_MATRIX|STALE_MODERN_MEAN)' bounded-threat.log > bounded-threat-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bounded-threat-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record bounded threat staleness result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-threat
          path: bounded-threat.log
