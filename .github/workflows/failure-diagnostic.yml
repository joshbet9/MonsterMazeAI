name: Diagnostic — Selected Monster Maze Failures

on:
  workflow_dispatch:
  push:
    branches:
      - autonomous/deterministic-v44-clean

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - run: |
          mvn -B -ntp -pl common -am \
            -Dtest=FailureDiagnosticIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test
