name: Fast Bottleneck Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: monstermaze-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast controller + routing + bottleneck smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Fast regressions + representative smoke
        run: |
          mvn -B -ntp -pl common -am             -Dtest=StableLiveMovementControllerTest,MonsterAwareRoutePlannerTest,AbilityModelTest,BottleneckSmokeSimulationTest             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             -Dsurefire.failIfNoSpecifiedTests=false             test
