name: Fix — finalize grounded gap destination before takeoff

on:
  push:
    branches:
      - fix/gap-destination-confirm-before-takeoff-v1

permissions:
  contents: read

jobs:
  jumper:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run three Modern Jumper cells
        shell: bash
        run: |
          set -o pipefail
          : > gap-confirm.log
          for pattern in 1 2 3; do
            echo "===== MODERN P$pattern JUMPER =====" | tee -a gap-confirm.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit=JUMPER               -DmatrixSpawnMonsters=true               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a gap-confirm.log
          done
          grep -E '^(FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' gap-confirm.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gap-destination-confirm
          path: gap-confirm.log
