name: Human run analyzer

on:
  pull_request:
  push:
    branches:
      - main
      - feature/human-run-analysis
      - feature/human-run-recorder

jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run human-run analyzer tests
        working-directory: tools
        run: |
          python -m unittest -v test_human_run_analyzer.py
          python -m unittest -v test_human_run_dataset_analyzer.py

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyze all recorded human runs
        run: |
          python tools/human_run_dataset_analyzer.py human-runs --output-dir /tmp/human-run-dataset-analysis
      - name: Verify human dataset coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("/tmp/human-run-dataset-analysis/dataset-summary.json").read_text())
          expected = {
              "20260930-174746-835": ("MAVERICK", 3, 49),
              "20260930-181006-247": ("REPULSOR", 2, 26),
              "20260930-195111-185": ("JUMPER", 1, 38),
              "20260930-195904-165": ("SLOWBALLER", 3, 1),
              "20260930-195916-359": ("SLOWBALLER", 1, 21),
              "20260930-200313-358": ("BODY_BUILDER", 3, 41),
          }

          assert summary["dataset"]["runCount"] == len(expected), summary["dataset"]
          seen = {}
          for run in summary["runs"]:
              run_id = run["runId"]
              seen[run_id] = (
                  run["conditions"].get("kit"),
                  run["conditions"].get("pattern"),
                  run["run"].get("stageReached"),
              )
              assert "MISSING_KIT_METADATA" not in run["anomalyTypes"], run

          assert seen == expected, {"expected": expected, "seen": seen}
          print(json.dumps(summary["dataset"], indent=2, sort_keys=True))
          PY
      - name: Upload human dataset analysis
        uses: actions/upload-artifact@v4
        with:
          name: human-run-dataset-analysis
          path: |
            /tmp/human-run-dataset-analysis/dataset-summary.json
            /tmp/human-run-dataset-analysis/runs.jsonl
            /tmp/human-run-dataset-analysis/runs/**/*.jsonl
            /tmp/human-run-dataset-analysis/runs/**/analysis/*.json

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tick-level human trace physics calibration
        run: |
          mvn -B -ntp -pl common -am             -Dtest=HumanTracePhysicsCalibrationTest             -Dsurefire.failIfNoSpecifiedTests=false             test
      - name: Upload calibration residual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-trace-physics-calibration
          path: |
            common/target/surefire-reports/me.monstermazeai.physics.HumanTracePhysicsCalibrationTest.txt
            common/target/surefire-reports/TEST-me.monstermazeai.physics.HumanTracePhysicsCalibrationTest.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyze recorded run
        run: |
          python tools/human_run_analyzer.py human-runs --manifest human-runs/human-speed-run-20260930-174746-835-manifest.json --output-dir /tmp/human-run-analysis

      - name: Resolve simulator conditions
        id: human_conditions
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("/tmp/human-run-analysis/analysis/summary.json").read_text())
          conditions = summary["conditions"]
          required = ("mode", "kit", "pattern")
          missing = [key for key in required if conditions.get(key) is None]
          if missing:
              raise SystemExit(f"missing simulator conditions: {missing}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"mode={conditions['mode'].upper()}\n")
              output.write(f"kit={conditions['kit'].upper()}\n")
              output.write(f"pattern={int(conditions['pattern'])}\n")
              output.write("profile=HIGH_SKILL\n")

          print(json.dumps({
              "mode": conditions["mode"],
              "kit": conditions["kit"],
              "pattern": conditions["pattern"],
              "profile": "HIGH_SKILL",
          }, indent=2))

      - name: Build long-horizon matching simulator summary
        run: |
          mvn -B -ntp -pl common -am             -Dtest=HumanRunSimulatorExportTest             -Dsurefire.failIfNoSpecifiedTests=false             -DhumanRunMode=${{ steps.human_conditions.outputs.mode }}             -DhumanRunKit=${{ steps.human_conditions.outputs.kit }}             -DhumanRunPattern=${{ steps.human_conditions.outputs.pattern }}             -DhumanRunProfile=${{ steps.human_conditions.outputs.profile }} -DhumanRunComparison=true             -DhumanRunSimulatorSummary=$GITHUB_WORKSPACE/simulator-summary.json             test

      - name: Analyze recorded run against matching simulator
        run: |
          python tools/human_run_analyzer.py human-runs             --manifest human-runs/human-speed-run-20260930-174746-835-manifest.json             --output-dir /tmp/human-run-analysis             --sim-summary simulator-summary.json

      - name: Verify human-vs-simulator comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("/tmp/human-run-analysis/analysis/summary.json").read_text())
          anomalies = json.loads(Path("/tmp/human-run-analysis/analysis/anomalies.json").read_text())
          simulator = json.loads(Path("simulator-summary.json").read_text())
          comparison = json.loads(Path("/tmp/human-run-analysis/analysis/simulator-comparison.json").read_text())

          assert summary["run"]["stageReached"] == 49, summary["run"]
          assert summary["conditions"]["mode"] == "speed", summary["conditions"]
          assert summary["conditions"]["kit"] == "MAVERICK", summary["conditions"]
          assert summary["conditions"]["pattern"] == 3, summary["conditions"]
          assert simulator["conditions"]["mode"] == summary["conditions"]["mode"]
          assert simulator["conditions"]["kit"] == summary["conditions"]["kit"]
          assert simulator["conditions"]["pattern"] == summary["conditions"]["pattern"]
          assert simulator["conditions"]["profile"] == "HIGH_SKILL"
          assert simulator["simulator"]["durationTicks"] > 0
          assert comparison["conditionMatch"] is True, comparison
          assert comparison["gaps"], comparison
          assert any(a["type"] == "KIT_CONFLICT" for a in anomalies), anomalies
          assert any(a["type"] == "WORLD_STAGE_CONFLICT" for a in anomalies), anomalies

          print(json.dumps({
              "human": {
                  "stageReached": summary["run"]["stageReached"],
                  "mode": summary["conditions"]["mode"],
                  "kit": summary["conditions"]["kit"],
                  "pattern": summary["conditions"]["pattern"],
              },
              "simulator": simulator["simulator"],
              "anomalyTypes": sorted({a["type"] for a in anomalies}),
              "comparisonMetrics": [g["metric"] for g in comparison["gaps"]],
          }, indent=2))
          PY

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: human-vs-simulator-report
          path: |
            simulator-summary.json
            /tmp/human-run-analysis/analysis/summary.json
            /tmp/human-run-analysis/analysis/anomalies.json
            /tmp/human-run-analysis/analysis/simulator-comparison.json
            /tmp/human-run-analysis/normalized/*.jsonl
