name: Monster Maze AI 1.8.9 In-Game Build

on:
  push:
    branches: [ feature/ingame-high-skill-controller-20261006 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build common runtime
        run: mvn -B -ntp -pl common -am package -DskipTests
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
      - name: Resolve ForgeGradle workspace
        working-directory: minecraft-1.8
        run: gradle --no-daemon setupCIWorkspace
      - name: Build and test 1.8.9 adapter
        working-directory: minecraft-1.8
        run: gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: monster-maze-ai-1.8-high-skill
          path: minecraft-1.8/build/libs/*.jar
          if-no-files-found: error