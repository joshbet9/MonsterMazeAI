name: Live Parity — Full Natural Matrix

on:
  push:
    branches:
      - fix/live-f7-human-recorder
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow } }-${{ github.event.pull_request.number || github.ref } }
  cancel-in-progress: true

jobs:
  matrix-case:
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [SPEED, MODERN]
        pattern: [1, 2, 3]
        kit: [JUMPER, SLOWBALLER, BODY_BUILDER, REPULSOR, MAVERICK]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run natural-end matrix cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=${{ matrix.mode }}             -DmatrixPattern=${{ matrix.pattern }}             -DmatrixKit=${{ matrix.kit }}             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee matrix-cell.log

      - name: Extract matrix row
        run: |
          grep 'FULL_MATRIX ' matrix-cell.log | tail -1 > matrix-row.txt
          test -s matrix-row.txt
          cat matrix-row.txt

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-parity-matrix-row-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: |
            matrix-row.txt
            matrix-cell.log

  aggregate:
    name: Aggregate 30-cell natural matrix
    needs: matrix-case
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all matrix cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: live-parity-matrix-row-*
          path: matrix-results
          merge-multiple: false

      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          rows = []
          rx = re.compile(
              r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)"
          )

          for path in Path("matrix-results").glob("**/matrix-row.txt"):
              m = rx.search(path.read_text(encoding="utf-8", errors="replace"))
              if m:
                  rows.append({
                      "mode": m.group(1),
                      "pattern": int(m.group(2)),
                      "kit": m.group(3),
                      "maxStage": int(m.group(4)),
                      "ticks": int(m.group(5)),
                      "health": float(m.group(6)),
                  })

          rows.sort(key=lambda r: (r["mode"], r["pattern"], r["kit"]))

          if len(rows) != 30:
              raise SystemExit(f"expected 30 rows, found {len(rows)}")

          speed = [r for r in rows if r["mode"] == "SPEED"]
          modern = [r for r in rows if r["mode"] == "MODERN"]
          summary = {
              "cases": 30,
              "stageSum": sum(r["maxStage"] for r in rows),
              "speedMeanStage": sum(r["maxStage"] for r in speed) / 15,
              "modernMeanStage": sum(r["maxStage"] for r in modern) / 15,
              "speedPeak": max(r["maxStage"] for r in speed),
              "modernPeak": max(r["maxStage"] for r in modern),
              "naturalSafetyCapTicks": 60000,
              "rows": rows,
          }

          Path("live-parity-natural-matrix.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps({k:v for k,v in summary.items() if k != "rows"}, indent=2))
          print("\n".join(
              f'{r["mode"]} P{r["pattern"]} {r["kit"]}: '
              f'stage={r["maxStage"]} ticks={r["ticks"]} health={r["health"]:.2f}'
              for r in rows
          ))
          PY

      - name: Upload aggregate matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-parity-natural-matrix-summary
          path: live-parity-natural-matrix.json
