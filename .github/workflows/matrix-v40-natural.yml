name: Matrix — Natural Baseline v40
# trigger final baseline after controller branch setup

on:
  push:
    branches:
      - autonomous/natural-baseline-v40
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  matrix-case:
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [SPEED, MODERN]
        pattern: [1, 2, 3]
        kit: [JUMPER, SLOWBALLER, BODY_BUILDER, REPULSOR, MAVERICK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run natural-termination cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=${{ matrix.mode }}             -DmatrixPattern=${{ matrix.pattern }}             -DmatrixKit=${{ matrix.kit }}             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee matrix-cell.log
      - name: Extract row
        run: |
          grep 'FULL_MATRIX ' matrix-cell.log | tail -1 > matrix-row.txt
          test -s matrix-row.txt
          cat matrix-row.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-row-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: |
            matrix-row.txt
            matrix-cell.log

  aggregate:
    name: Aggregate 30-cell natural baseline
    needs: matrix-case
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-row-*
          path: matrix-results
          merge-multiple: false
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          rx=re.compile(r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)")
          rows=[]
          for p in Path('matrix-results').glob('**/matrix-row.txt'):
              m=rx.search(p.read_text(encoding='utf-8',errors='replace'))
              if m:
                  rows.append({'mode':m.group(1),'pattern':int(m.group(2)),'kit':m.group(3),'maxStage':int(m.group(4)),'ticks':int(m.group(5)),'health':float(m.group(6))})
          rows.sort(key=lambda r:(r['mode'],r['pattern'],r['kit']))
          if len(rows)!=30: raise SystemExit(f'expected 30 rows, got {len(rows)}')
          speed=[r['maxStage'] for r in rows if r['mode']=='SPEED']
          modern=[r['maxStage'] for r in rows if r['mode']=='MODERN']
          summary={'cases':30,'stageSum':sum(r['maxStage'] for r in rows),'speedMeanStage':sum(speed)/15,'modernMeanStage':sum(modern)/15,'speedPeak':max(speed),'modernPeak':max(modern),'rows':rows}
          Path('matrix-v40-natural.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k!='rows'},indent=2))
          print('\n'.join(f"{r['mode']} P{r['pattern']} {r['kit']}: stage={r['maxStage']} ticks={r['ticks']} health={r['health']:.2f}" for r in rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-v40-natural-summary
          path: matrix-v40-natural.json
