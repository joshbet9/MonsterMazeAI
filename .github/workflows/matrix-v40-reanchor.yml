name: Matrix v40 — Route Re-anchor

on:
  push:
    branches:
      - autonomous/local-threat-reanchor-v43
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  matrix:
    name: Full natural-termination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run full 30-cell natural-termination matrix
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee matrix-v43.log

      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path("matrix-v40.log").read_text(encoding="utf-8", errors="replace")
          rx = re.compile(
              r"(SPEED_FULL_RUN|MODERN_FULL_RUN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"maxStage=(\d+)\s+ticks=(\d+)\s+health=([-\d.]+)"
          )
          rows = []
          for m in rx.finditer(text):
              rows.append({
                  "mode": m.group(1).replace("_FULL_RUN", ""),
                  "pattern": int(m.group(2)),
                  "kit": m.group(3),
                  "maxStage": int(m.group(4)),
                  "ticks": int(m.group(5)),
                  "health": float(m.group(6)),
              })

          if len(rows) != 30:
              raise SystemExit(f"expected 30 rows, found {len(rows)}")

          by_mode = {}
          for mode in ("SPEED", "MODERN"):
              values = [r["maxStage"] for r in rows if r["mode"] == mode]
              by_mode[mode] = {
                  "meanStage": sum(values) / len(values),
                  "minStage": min(values),
                  "maxStage": max(values),
              }

          summary = {
              "cases": len(rows),
              "stageSum": sum(r["maxStage"] for r in rows),
              "speedMeanStage": by_mode["SPEED"]["meanStage"],
              "modernMeanStage": by_mode["MODERN"]["meanStage"],
              "speedPeak": by_mode["SPEED"]["maxStage"],
              "modernPeak": by_mode["MODERN"]["maxStage"],
              "rows": rows,
          }
          Path("matrix-v43.json").write_text(json.dumps(summary, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in summary.items() if k != "rows"}, indent=2))
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v43-${{ github.sha }}
          path: |
            matrix-v40.log
            matrix-v40.json
