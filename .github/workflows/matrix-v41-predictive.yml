name: Matrix v41 — Predictive Route Threat

on:
  push:
    branches:
      - autonomous/predictive-route-threat-v41
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  regression:
    name: Predictive routing regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run predictive routing regressions
        run: |
          mvn -B -ntp -pl common -am \
            -Dtest=MonsterAwareRoutePlannerTest,StableLiveMovementControllerTest \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test

  matrix-case:
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [SPEED, MODERN]
        pattern: [1, 2, 3]
        kit: [JUMPER, SLOWBALLER, BODY_BUILDER, REPULSOR, MAVERICK]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run one natural-termination matrix cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
            -DmatrixMode=${{ matrix.mode }} \
            -DmatrixPattern=${{ matrix.pattern }} \
            -DmatrixKit=${{ matrix.kit }} \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test 2>&1 | tee matrix-cell.log

      - name: Extract matrix row
        run: |
          grep 'FULL_MATRIX ' matrix-cell.log | tail -1 > matrix-row.txt
          test -s matrix-row.txt
          cat matrix-row.txt

      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-row-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: |
            matrix-row.txt
            matrix-cell.log

  aggregate:
    name: Aggregate full 30-cell matrix
    needs: matrix-case
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all matrix cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-row-*
          path: matrix-results
          merge-multiple: false

      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          rows = []
          rx = re.compile(
              r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)"
          )

          for path in Path('matrix-results').glob('**/matrix-row.txt'):
              text = path.read_text(encoding='utf-8', errors='replace')
              m = rx.search(text)
              if m:
                  rows.append({
                      'mode': m.group(1),
                      'pattern': int(m.group(2)),
                      'kit': m.group(3),
                      'maxStage': int(m.group(4)),
                      'ticks': int(m.group(5)),
                      'health': float(m.group(6)),
                  })

          rows.sort(key=lambda r: (r['mode'], r['pattern'], r['kit']))

          if len(rows) != 30:
              raise SystemExit(f'expected 30 matrix rows, found {len(rows)}')

          summary = {
              'cases': len(rows),
              'stageSum': sum(r['maxStage'] for r in rows),
              'speedMeanStage': sum(r['maxStage'] for r in rows if r['mode'] == 'SPEED') / 15,
              'modernMeanStage': sum(r['maxStage'] for r in rows if r['mode'] == 'MODERN') / 15,
              'speedPeak': max(r['maxStage'] for r in rows if r['mode'] == 'SPEED'),
              'modernPeak': max(r['maxStage'] for r in rows if r['mode'] == 'MODERN'),
              'rows': rows,
          }

          Path('matrix-v41.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in summary.items() if k != 'rows'}, indent=2))
          print('\n'.join(
              f'{r["mode"]} P{r["pattern"]} {r["kit"]}: stage={r["maxStage"]} ticks={r["ticks"]} health={r["health"]:.2f}'
              for r in rows
          ))
          PY

      - name: Upload aggregate matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v41-summary
          path: matrix-v41.json
