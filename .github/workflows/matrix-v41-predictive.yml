name: Matrix v41 — Predictive Route Threat

on:
  push:
    branches:
      - autonomous/predictive-route-threat-v41
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  regression:
    name: Predictive routing regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run predictive routing regressions
        run: |
          mvn -B -ntp -pl common -am \
            -Dtest=MonsterAwareRoutePlannerTest,StableLiveMovementControllerTest \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test

  matrix:
    name: Full natural-termination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run full 30-cell natural-termination matrix
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=AuthenticStage10SimulationTest#fullNaturalTerminationMatrix \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee matrix-v41.log

      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path("matrix-v41.log").read_text(encoding="utf-8", errors="replace")
          rx = re.compile(
              r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)"
          )
          rows = []
          for m in rx.finditer(text):
              rows.append({
                  "mode": m.group(1),
                  "pattern": int(m.group(2)),
                  "kit": m.group(3),
                  "maxStage": int(m.group(4)),
                  "ticks": int(m.group(5)),
                  "health": float(m.group(6)),
              })

          if len(rows) != 30:
              raise SystemExit(f"expected 30 rows, found {len(rows)}")

          summary = {
              "cases": len(rows),
              "stageSum": sum(r["maxStage"] for r in rows),
              "speedMeanStage": sum(r["maxStage"] for r in rows if r["mode"] == "SPEED") / 15,
              "modernMeanStage": sum(r["maxStage"] for r in rows if r["mode"] == "MODERN") / 15,
              "speedPeak": max(r["maxStage"] for r in rows if r["mode"] == "SPEED"),
              "modernPeak": max(r["maxStage"] for r in rows if r["mode"] == "MODERN"),
              "rows": rows,
          }
          Path("matrix-v41.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({k: v for k, v in summary.items() if k != "rows"}, indent=2))
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v41-${{ github.sha }}
          path: |
            matrix-v41.log
            matrix-v41.json
