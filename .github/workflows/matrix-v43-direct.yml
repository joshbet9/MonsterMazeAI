name: Matrix v43 — Direct Oracle Controller

on:
  push:
    branches:
      - autonomous/oracle-direct-v1
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  matrix-case:
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [SPEED, MODERN]
        pattern: [1, 2, 3]
        kit: [JUMPER, SLOWBALLER, BODY_BUILDER, REPULSOR, MAVERICK]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run natural-termination cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=${{ matrix.mode }}             -DmatrixPattern=${{ matrix.pattern }}             -DmatrixKit=${{ matrix.kit }}             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee matrix-cell.log
      - name: Extract row
        run: |
          grep 'FULL_MATRIX ' matrix-cell.log | tail -1 > matrix-row.txt
          test -s matrix-row.txt
          cat matrix-row.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v43-row-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: |
            matrix-row.txt
            matrix-cell.log

  aggregate:
    name: Aggregate v43 30-cell matrix
    needs: matrix-case
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-v43-row-*
          path: matrix-results
          merge-multiple: false
      - name: Summarize
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          rows=[]
          rx=re.compile(r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)")
          for p in Path("matrix-results").glob("**/matrix-row.txt"):
              m=rx.search(p.read_text(errors="replace"))
              if m:
                  rows.append({"mode":m.group(1),"pattern":int(m.group(2)),"kit":m.group(3),"maxStage":int(m.group(4)),"ticks":int(m.group(5)),"health":float(m.group(6))})
          rows.sort(key=lambda r:(r["mode"],r["pattern"],r["kit"]))
          if len(rows)!=30: raise SystemExit(f"expected 30 rows, found {len(rows)}")
          speed=[r["maxStage"] for r in rows if r["mode"]=="SPEED"]
          modern=[r["maxStage"] for r in rows if r["mode"]=="MODERN"]
          summary={"cases":30,"stageSum":sum(r["maxStage"] for r in rows),"speedMeanStage":sum(speed)/15,"modernMeanStage":sum(modern)/15,"speedPeak":max(speed),"modernPeak":max(modern),"baselineStageSum":458,"baselineSpeedMeanStage":21.67,"baselineModernMeanStage":8.87,"rows":rows}
          summary["deltaStageSum"]=summary["stageSum"]-458
          summary["deltaSpeedMeanStage"]=summary["speedMeanStage"]-21.67
          summary["deltaModernMeanStage"]=summary["modernMeanStage"]-8.87
          Path("matrix-v43.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps({k:v for k,v in summary.items() if k!="rows"},indent=2))
          for r in rows: print(f'{r["mode"]} P{r["pattern"]} {r["kit"]}: stage={r["maxStage"]} ticks={r["ticks"]} health={r["health"]:.2f}')
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v43-summary
          path: matrix-v43.json
      - name: Publish matrix to PR
        if: github.event_name == 'pull_request' && hashFiles('matrix-v43.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('matrix-v43.json','utf8'));
            const marker='<!-- monstermaze-v43-matrix -->';
            const rows=s.rows.map(r=>`| ${r.mode} | P${r.pattern} | ${r.kit} | ${r.maxStage} | ${r.ticks} | ${r.health.toFixed(2)} |`).join('\n');
            const body=[marker,'## v43 direct-oracle natural-termination matrix','',`**Stage sum:** ${s.stageSum} (baseline 458; delta ${s.deltaStageSum>=0?'+':''}${s.deltaStageSum})`,'',`**Speed:** mean ${s.speedMeanStage.toFixed(2)} / peak ${s.speedPeak} (baseline mean 21.67)`,'',`**Modern:** mean ${s.modernMeanStage.toFixed(2)} / peak ${s.modernPeak} (baseline mean 8.87)`,'','| Mode | Pattern | Kit | Stage | Ticks | Health |','|---|---|---|---:|---:|---:|',rows].join('\n');
            const {owner,repo}=context.repo, issue_number=context.issue.number;
            const comments=await github.rest.issues.listComments({owner,repo,issue_number,per_page:100});
            const old=comments.data.find(c=>c.user?.type==='Bot' && c.body?.includes(marker));
            if(old) await github.rest.issues.updateComment({owner,repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
