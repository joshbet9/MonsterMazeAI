name: Matrix v44 — Local avoidance

on:
  push:
    branches:
      - autonomous/routing-v44-local-avoidance
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: monstermaze-v43-matrix
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  matrix:
    name: Full 30-cell natural-termination matrix
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install

      - name: Run full natural-termination matrix
        run: |
          cmd /c "mvn -B -ntp -pl common -am -Dtest=NaturalTerminationMatrixIT#allNaturalTerminationCases -Dsurefire.failIfNoSpecifiedTests=false -Dsurefire.useFile=false -Dsurefire.redirectTestOutputToFile=false test > matrix-v43.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content matrix-v43.log
          if ($code -ne 0) { exit $code }

      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          rows = []
          rx = re.compile(
              r"FULL_MATRIX\s+mode=(SPEED|MODERN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"stage=(\d+)\s+ticks=(\d+)\s+health=([\-\d.]+)"
          )
          for line in Path('matrix-v43.log').read_text(encoding='utf-8', errors='replace').splitlines():
              m = rx.search(line)
              if m:
                  rows.append({
                      'mode': m.group(1),
                      'pattern': int(m.group(2)),
                      'kit': m.group(3),
                      'maxStage': int(m.group(4)),
                      'ticks': int(m.group(5)),
                      'health': float(m.group(6)),
                  })
          # Surefire can echo the test output more than once; de-duplicate exact cells.
          unique = {(r['mode'], r['pattern'], r['kit']): r for r in rows}
          rows = sorted(unique.values(), key=lambda r: (r['mode'], r['pattern'], r['kit']))
          if len(rows) != 30:
              raise SystemExit(f'expected 30 unique matrix rows, found {len(rows)}')

          speed = [r['maxStage'] for r in rows if r['mode'] == 'SPEED']
          modern = [r['maxStage'] for r in rows if r['mode'] == 'MODERN']
          summary = {
              'cases': 30,
              'stageSum': sum(r['maxStage'] for r in rows),
              'speedMeanStage': sum(speed) / 15,
              'modernMeanStage': sum(modern) / 15,
              'speedPeak': max(speed),
              'modernPeak': max(modern),
              'baselineStageSum': 458,
              'baselineSpeedMeanStage': 21.67,
              'baselineModernMeanStage': 8.87,
              'deltaStageSum': sum(r['maxStage'] for r in rows) - 458,
              'deltaSpeedMeanStage': sum(speed) / 15 - 21.67,
              'deltaModernMeanStage': sum(modern) / 15 - 8.87,
              'targetSpeedPeak': 70,
              'targetModernPeak': 40,
              'rows': rows,
          }
          Path('matrix-v43.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in summary.items() if k != 'rows'}, indent=2))
          print('\n'.join(
              f"{r['mode']} P{r['pattern']} {r['kit']}: stage={r['maxStage']} ticks={r['ticks']} health={r['health']:.2f}"
              for r in rows
          ))
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v43-full-summary
          path: |
            matrix-v43.json
            matrix-v43.log

      - name: Publish matrix to PR
        if: github.event_name == 'pull_request' && hashFiles('matrix-v43.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('matrix-v43.json', 'utf8'));
            const marker = '<!-- monstermaze-v43-matrix -->';
            const rows = summary.rows.map(r =>
              '| ' + r.mode + ' | P' + r.pattern + ' | ' + r.kit +
              ' | ' + r.maxStage + ' | ' + r.ticks + ' | ' + r.health.toFixed(2) + ' |'
            ).join('\n');
            const body = [
              marker,
              '## v43 natural-termination matrix',
              '',
              '**Stage sum:** ' + summary.stageSum + ' (baseline 458; delta ' +
                (summary.deltaStageSum >= 0 ? '+' : '') + summary.deltaStageSum + ')',
              '',
              '**Speed:** mean ' + summary.speedMeanStage.toFixed(2) +
                ' / peak ' + summary.speedPeak + ' (baseline mean 21.67)',
              '',
              '**Modern:** mean ' + summary.modernMeanStage.toFixed(2) +
                ' / peak ' + summary.modernPeak + ' (baseline mean 8.87)',
              '',
              '| Mode | Pattern | Kit | Stage | Ticks | Health |',
              '|---|---|---|---:|---:|---:|',
              rows
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue = context.issue.number;
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number: issue, per_page: 100
            });
            const previous = existing.data.find(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue, body
              });
            }
