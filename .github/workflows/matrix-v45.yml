name: Matrix v45 — Preserve Route Across Mob Bumps

on:
  push:
    branches:
      - autonomous/preserve-route-after-bump-v45
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  matrix:
    name: Full 30-cell natural-termination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run full natural-termination matrix
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee matrix-v45.log
      - name: Summarize matrix
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          text = Path("matrix-v45.log").read_text(encoding="utf-8", errors="replace")
          rx = re.compile(
              r"(SPEED_FULL_RUN|MODERN_FULL_RUN)\s+pattern=(\d+)\s+kit=([A-Z_]+)\s+"
              r"maxStage=(\d+)\s+ticks=(\d+)\s+health=([-\d.]+)"
          )
          rows = []
          for m in rx.finditer(text):
              rows.append({
                  "mode": m.group(1).replace("_FULL_RUN", ""),
                  "pattern": int(m.group(2)),
                  "kit": m.group(3),
                  "maxStage": int(m.group(4)),
                  "ticks": int(m.group(5)),
                  "health": float(m.group(6)),
              })
          if len(rows) != 30:
              raise SystemExit(f"expected 30 rows, found {len(rows)}")
          rows.sort(key=lambda r: (r["mode"], r["pattern"], r["kit"]))
          speed = [r["maxStage"] for r in rows if r["mode"] == "SPEED"]
          modern = [r["maxStage"] for r in rows if r["mode"] == "MODERN"]
          ssum = sum(r["maxStage"] for r in rows)
          summary = {
              "cases": 30,
              "stageSum": ssum,
              "speedMeanStage": sum(speed) / 15,
              "modernMeanStage": sum(modern) / 15,
              "speedPeak": max(speed),
              "modernPeak": max(modern),
              "baselineStageSum": 488,
              "baselineSpeedMeanStage": 22.466666666666668,
              "baselineModernMeanStage": 10.066666666666666,
              "deltaStageSum": ssum - 488,
              "deltaSpeedMeanStage": sum(speed) / 15 - 22.466666666666668,
              "deltaModernMeanStage": sum(modern) / 15 - 10.066666666666666,
              "rows": rows,
          }
          Path("matrix-v45.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({k:v for k,v in summary.items() if k != "rows"}, indent=2))
          PY
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstermaze-matrix-v45-${{ github.sha }}
          path: |
            matrix-v45.log
            matrix-v45.json
