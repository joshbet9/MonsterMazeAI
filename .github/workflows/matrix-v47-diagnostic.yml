name: Matrix v47 — Targeted no-mob locomotion diagnostics

on:
  push:
    branches:
      - autonomous/locomotion-026-v1

concurrency:
  group: monstermaze-v47-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    name: Targeted no-mob locomotion diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run targeted diagnostics
        run: |
          set -o pipefail
          cases=(
            "MODERN 2 SLOWBALLER"
            "SPEED 2 SLOWBALLER"
            "MODERN 1 JUMPER"
            "SPEED 3 JUMPER"
          )
          : > diagnostic.log
          for c in "${cases[@]}"; do
            read -r mode pattern kit <<< "$c"
            echo "===== $c =====" | tee -a diagnostic.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode="$mode"               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=false               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a diagnostic.log
          done
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v47-diagnostic-${{ github.sha }}
          path: diagnostic.log
