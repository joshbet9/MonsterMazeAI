name: Matrix v47 — Targeted no-mob locomotion diagnostics

on:
  push:
    branches:
      - autonomous/locomotion-026-v1
  pull_request:
    branches: [ main ]

concurrency:
  group: monstermaze-v47-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    name: Targeted locomotion diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: MODERN
            pattern: 2
            kit: SLOWBALLER
          - mode: SPEED
            pattern: 2
            kit: SLOWBALLER
          - mode: MODERN
            pattern: 1
            kit: JUMPER
          - mode: SPEED
            pattern: 3
            kit: JUMPER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run diagnostic cell
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=${{ matrix.mode }}             -DmatrixPattern=${{ matrix.pattern }}             -DmatrixKit=${{ matrix.kit }}             -DmatrixSpawnMonsters=false             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee diagnostic.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-v47-${{ matrix.mode }}-${{ matrix.pattern }}-${{ matrix.kit }}
          path: diagnostic.log
