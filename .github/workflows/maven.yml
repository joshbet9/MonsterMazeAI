name: Maven CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/first-pad-movement, feature/first-pad-movement-v2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: monstermaze-maven-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Common Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test common (fast verification; matrix promotion-only)
        run: mvn -B -ntp -Pfast-verify verify

      - name: First-pad deterministic physics simulation
        run: mvn -B -ntp -pl common -am -Dtest=FirstPadMovementControllerTest,FirstPadMovementPhysicsSimulationTest -Dsurefire.failIfNoSpecifiedTests=false test

