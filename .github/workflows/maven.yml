name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  common:
    name: Common Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test common
        run: mvn -B -ntp verify

  minecraft-1-8:
    name: Minecraft 1.8.9 Forge build
    runs-on: ubuntu-latest
    needs: common

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build common dependency
        run: mvn -B -ntp -pl common -am package -DskipTests

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Resolve ForgeGradle workspace
        working-directory: minecraft-1.8
        run: gradle --no-daemon setupDecompWorkspace

      - name: Build Minecraft 1.8.9 adapter
        working-directory: minecraft-1.8
        run: gradle --no-daemon build
