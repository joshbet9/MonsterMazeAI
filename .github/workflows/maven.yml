name: Maven CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/first-pad-movement, feature/first-pad-movement-v2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  common:
    name: Common Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test common
        run: mvn -B -ntp verify

      - name: First-pad deterministic physics simulation
        run: mvn -B -ntp -pl common -am -Dtest=FirstPadMovementControllerTest,FirstPadMovementPhysicsSimulationTest -Dsurefire.failIfNoSpecifiedTests=false test

  speed-diagnostic:
    name: Speed failure diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run focused Speed diagnostics
        run: mvn -B -ntp -pl common -am -Dtest=SpeedFailureDiagnosticTest -Dsurefire.failIfNoSpecifiedTests=false test

  speed-full-run:
    name: Speed full-run diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run every Speed case to natural termination
        run: mvn -B -ntp -pl common -am -Dtest=SpeedFullRunDiagnosticTest -Dsurefire.failIfNoSpecifiedTests=false test

  modern-full-run:
    name: Modern full-run diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run every Modern case to natural termination
        run: mvn -B -ntp -pl common -am -Dtest=ModernFullRunDiagnosticTest -Dsurefire.failIfNoSpecifiedTests=false test
