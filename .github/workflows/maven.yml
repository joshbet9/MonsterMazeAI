name: Maven CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/first-pad-movement, feature/first-pad-movement-v2, feature/seamless-physics-movement-v1 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: maven-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  common:
    name: Common Maven tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test common
        run: mvn -B -ntp verify

      - name: First-pad deterministic physics simulation
        run: mvn -B -ntp -pl common -am -Dtest=FirstPadMovementControllerTest,FirstPadMovementPhysicsSimulationTest -Dsurefire.failIfNoSpecifiedTests=false test

