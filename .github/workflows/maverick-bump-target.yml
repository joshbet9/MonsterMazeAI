name: Experiment — Maverick padward bump targeting

on:
  push:
    branches:
      - experiment/maverick-bump-target-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all Maverick cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=MaverickBumpTargetIT#allMaverickCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee mavbump.log
          grep -E '^(MAVBUMP_MATRIX|MAVBUMP_MEAN)' mavbump.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mavbump
          path: mavbump.log
