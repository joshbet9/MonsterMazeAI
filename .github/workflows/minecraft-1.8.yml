name: Minecraft 1.8 Adapter CI

on:
  push:
    branches:
      - main
      - fix/minecraft-1.8-standalone-adapter
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Build Minecraft 1.8 mod
        working-directory: minecraft-1.8
        run: gradle --no-daemon build
