name: Minecraft 1.8 Adapter CI

on:
  push:
    branches:
      - main
      - fix/minecraft-1.8-standalone-adapter
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare ForgeGradle workspace
        working-directory: minecraft-1.8
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon setupDevWorkspace

      - name: Verify generated Forge compile input
        working-directory: minecraft-1.8
        shell: bash
        run: |
          set -euo pipefail
          forge_bin="$HOME/.gradle/caches/minecraft/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/stable/22/forgeBin.jar"
          test -f "$forge_bin"
          echo "Forge compile input: $forge_bin"
          ls -lh "$forge_bin"

      - name: Build Minecraft 1.8 mod
        working-directory: minecraft-1.8
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Verify mod artifact
        working-directory: minecraft-1.8
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          test -f "${jars[0]}"
          jar_file="${jars[0]}"
          echo "Built: $jar_file"
          jar tf "$jar_file" | grep -F 'me/monstermazeai/minecraft/v18/MonsterMaze18Mod.class'
          jar tf "$jar_file" | grep -F 'me/monstermazeai/minecraft/v18/Minecraft18Observer.class'
          jar tf "$jar_file" | grep -F 'mcmod.info'
