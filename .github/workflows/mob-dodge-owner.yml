name: Experiment — persistent mob dodge ownership

on:
  push:
    branches:
      - experiment/mob-dodge-owner-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run six difficult Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > dodge-owner.log
          for spec in "1 MAVERICK" "2 SLOWBALLER" "2 BODY_BUILDER" "3 JUMPER" "3 REPULSOR" "3 MAVERICK"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a dodge-owner.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a dodge-owner.log
          done
      - name: Capture
        run: |
          grep -E '^FULL_MATRIX' dodge-owner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dodge-owner
          path: dodge-owner.log
