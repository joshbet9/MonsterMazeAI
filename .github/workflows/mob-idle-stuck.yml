name: Experiment — mob idle stuck recovery v2
on:
  push:
    branches:
      - experiment/mob-idle-stuck-recovery-v1
permissions:
  contents: read
jobs:
  modern:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run six Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > stuck.log
          for spec in "1 SLOWBALLER" "2 MAVERICK" "1 BODY_BUILDER" "2 BODY_BUILDER" "3 BODY_BUILDER" "3 MAVERICK"; do
            set -- $spec
            echo "===== MODERN P$1 $2 =====" | tee -a stuck.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$1"               -DmatrixKit="$2"               -DmatrixSpawnMonsters=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a stuck.log
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("stuck.log").read_text(encoding="utf-8",errors="replace")
          rows=[(int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4)))
                for m in re.finditer(r"FULL_MATRIX mode=MODERN pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=6: raise SystemExit(f"expected 6 rows, got {len(rows)}")
          vals=[r[2] for r in rows]
          print(f"Modern mean={sum(vals)/len(vals):.4f} min={min(vals)} max={max(vals)} >=10={sum(v>=10 for v in vals)}/6")
          for p,k,s,ticks in rows: print(f"Modern P{p} {k} stage={s} ticks={ticks}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mob-idle-stuck
          path: stuck.log
