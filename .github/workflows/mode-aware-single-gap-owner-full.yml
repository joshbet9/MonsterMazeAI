name: Experiment — mode-aware tactical horizon full matrix

on:
  push:
    branches:
      - experiment/mode-aware-single-gap-owner-v1

permissions:
  contents: read

jobs:
  cell:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {mode: SPEED, pattern: 1, kit: JUMPER}
          - {mode: SPEED, pattern: 1, kit: SLOWBALLER}
          - {mode: SPEED, pattern: 1, kit: BODY_BUILDER}
          - {mode: SPEED, pattern: 1, kit: REPULSOR}
          - {mode: SPEED, pattern: 1, kit: MAVERICK}
          - {mode: SPEED, pattern: 2, kit: JUMPER}
          - {mode: SPEED, pattern: 2, kit: SLOWBALLER}
          - {mode: SPEED, pattern: 2, kit: BODY_BUILDER}
          - {mode: SPEED, pattern: 2, kit: REPULSOR}
          - {mode: SPEED, pattern: 2, kit: MAVERICK}
          - {mode: SPEED, pattern: 3, kit: JUMPER}
          - {mode: SPEED, pattern: 3, kit: SLOWBALLER}
          - {mode: SPEED, pattern: 3, kit: BODY_BUILDER}
          - {mode: SPEED, pattern: 3, kit: REPULSOR}
          - {mode: SPEED, pattern: 3, kit: MAVERICK}
          - {mode: MODERN, pattern: 1, kit: JUMPER}
          - {mode: MODERN, pattern: 1, kit: SLOWBALLER}
          - {mode: MODERN, pattern: 1, kit: BODY_BUILDER}
          - {mode: MODERN, pattern: 1, kit: REPULSOR}
          - {mode: MODERN, pattern: 1, kit: MAVERICK}
          - {mode: MODERN, pattern: 2, kit: JUMPER}
          - {mode: MODERN, pattern: 2, kit: SLOWBALLER}
          - {mode: MODERN, pattern: 2, kit: BODY_BUILDER}
          - {mode: MODERN, pattern: 2, kit: REPULSOR}
          - {mode: MODERN, pattern: 2, kit: MAVERICK}
          - {mode: MODERN, pattern: 3, kit: JUMPER}
          - {mode: MODERN, pattern: 3, kit: SLOWBALLER}
          - {mode: MODERN, pattern: 3, kit: BODY_BUILDER}
          - {mode: MODERN, pattern: 3, kit: REPULSOR}
          - {mode: MODERN, pattern: 3, kit: MAVERICK}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run cell
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
            -DmatrixMode="${{ matrix.mode }}" \
            -DmatrixPattern="${{ matrix.pattern }}" \
            -DmatrixKit="${{ matrix.kit }}" \
            -DmatrixSpawnMonsters=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test 2>&1 | tee cell.log
          grep '^FULL_MATRIX ' cell.log > cell-report.txt
          test -s cell-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.mode }}-P${{ matrix.pattern }}-${{ matrix.kit }}
          path: cell-report.txt

  aggregate:
    needs: cell
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: cells
          merge-multiple: false
      - name: Aggregate
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t="\n".join(p.read_text(encoding="utf-8",errors="replace") for p in Path("cells").rglob("cell-report.txt"))
          rows=[(m.group(1),int(m.group(2)),m.group(3),int(m.group(4)),int(m.group(5)))
                for m in re.finditer(r"FULL_MATRIX mode=(SPEED|MODERN) pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=30: raise SystemExit(f"expected 30 rows, got {len(rows)}")
          sp=[r[3] for r in rows if r[0]=="SPEED"]; mo=[r[3] for r in rows if r[0]=="MODERN"]
          lines=[
            f"Speed mean={sum(sp)/15:.4f} min={min(sp)} max={max(sp)} >=70={sum(x>=70 for x in sp)}/15",
            f"Modern mean={sum(mo)/15:.4f} min={min(mo)} max={max(mo)} >=40={sum(x>=40 for x in mo)}/15"
          ]
          lines += [f"{r[0]} P{r[1]} {r[2]} stage={r[3]} ticks={r[4]}" for r in rows]
          Path("mode-aware-horizon-report.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode-aware-horizon-report
          path: mode-aware-horizon-report.txt
