name: Monster Maze - Full Simulation Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/seamless-physics-movement-v1
      - architecture/cpu-opponents-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  movement-regressions:
    name: Movement regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am install -DskipTests
      - name: Run focused movement suite
        run: mvn -B -ntp -pl common "-Dtest=StableLiveMovementControllerTest" test

  full-matrix:
    name: Full natural-termination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am install -DskipTests
      - name: Run unrestricted Speed + Modern matrix
        shell: bash
        run: |
          mkdir -p simulation-artifacts
          set +e
          mvn -B -ntp -pl common \
            "-Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest" \
            "-Dsurefire.useFile=false" \
            "-Dsurefire.redirectTestOutputToFile=false" \
            test 2>&1 | tee simulation-artifacts/full-matrix.log
          rc=${PIPESTATUS[0]}
          grep -E '^(SPEED_FULL_RUN|MODERN_FULL_RUN) ' simulation-artifacts/full-matrix.log > simulation-artifacts/full-matrix-rows.txt || true
          grep -E '^(TERMINAL_DECISION) ' simulation-artifacts/full-matrix.log > simulation-artifacts/terminal-decisions.txt || true
          echo "maven_exit_code=${rc}" | tee simulation-artifacts/status.txt
          exit "${rc}"
      - name: Publish matrix summary
        if: always()
        shell: bash
        run: |
          echo "## Full natural-termination matrix" >> "$GITHUB_STEP_SUMMARY"
          cat simulation-artifacts/full-matrix-rows.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstermaze-full-matrix-${{ github.sha }}
          path: simulation-artifacts/
          if-no-files-found: warn

  selected-behavior:
    name: Behavioral diagnostics / ${{ matrix.case }}
    needs: full-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
          - MODERN:P1:JUMPER
          - MODERN:P1:SLOWBALLER
          - MODERN:P2:REPULSOR
          - MODERN:P3:JUMPER
          - MODERN:P3:BODY_BUILDER
          - MODERN:P3:REPULSOR
          - SPEED:P1:JUMPER
          - SPEED:P3:JUMPER
          - SPEED:P2:MAVERICK
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am install -DskipTests
      - name: Run behavioral replay
        shell: bash
        run: |
          mkdir -p simulation-artifacts
          set +e
          mvn -B -ntp -pl common \
            "-Dtest=FullRunFailureDiagnosticTest" \
            "-Dmonstermaze.diag.case=${{ matrix.case }}" \
            "-Dsurefire.useFile=false" \
            "-Dsurefire.redirectTestOutputToFile=false" \
            test 2>&1 | tee simulation-artifacts/behavior.log
          rc=${PIPESTATUS[0]}
          grep -E '^(=====|RESULT |BEHAVIOR_TICK|COUNTS )' simulation-artifacts/behavior.log > simulation-artifacts/behavior-summary.txt || true
          echo "maven_exit_code=${rc}" > simulation-artifacts/status.txt
          exit "${rc}"
      - name: Publish behavioral summary
        if: always()
        shell: bash
        run: |
          echo "## Behavioral replay: ${{ matrix.case }}" >> "$GITHUB_STEP_SUMMARY"
          cat simulation-artifacts/behavior-summary.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload behavioral artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstermaze-behavior-${{ matrix.case }}-${{ github.sha }}
          path: simulation-artifacts/
          if-no-files-found: warn
