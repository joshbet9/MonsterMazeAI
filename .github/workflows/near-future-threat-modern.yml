name: Experiment — near-future threat route validation

on:
  push:
    branches:
      - experiment/route-near-future-threat-validation-v1

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all Modern cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixSpawnMonsters=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee near-future-modern.log
      - name: Summarize
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("near-future-modern.log").read_text(encoding="utf-8",errors="replace")
          rows=[(int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4)))
                for m in re.finditer(r"FULL_MATRIX mode=MODERN pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=15: raise SystemExit(f"expected 15 rows, got {len(rows)}")
          vals=[x[2] for x in rows]
          print(f"Modern mean={sum(vals)/15:.4f} min={min(vals)} max={max(vals)} >=10={sum(x>=10 for x in vals)}/15")
          for r in rows: print(f"Modern P{r[0]} {r[1]} stage={r[2]} ticks={r[3]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-future-modern
          path: near-future-modern.log
