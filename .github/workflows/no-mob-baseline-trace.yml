name: No-mob baseline targeted trace

on:
  push:
    branches:
      - autonomous/locomotion-026-v1

concurrency:
  group: monstermaze-no-mob-baseline-trace
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Trace worst no-gap cells
        run: |
          set -o pipefail
          cases=(
            "SPEED 2 SLOWBALLER"
            "SPEED 2 MAVERICK"
            "SPEED 2 REPULSOR"
            "SPEED 1 JUMPER"
            "MODERN 2 SLOWBALLER"
            "MODERN 2 MAVERICK"
            "MODERN 2 REPULSOR"
            "MODERN 1 JUMPER"
          )
          : > baseline-trace.log
          for c in "${cases[@]}"; do
            read -r mode pattern kit <<< "$c"
            echo "===== $c =====" | tee -a baseline-trace.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode="$mode"               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=false               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a baseline-trace.log
          done
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-mob-baseline-trace-${{ github.sha }}
          path: baseline-trace.log
