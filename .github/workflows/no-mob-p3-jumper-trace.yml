name: No-mob Pattern 3 Jumper trace

on:
  push:
    branches:
      - autonomous/locomotion-026-v1

concurrency:
  group: monstermaze-no-mob-p3-jumper-trace
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Trace Pattern 3 Jumper
        run: |
          set -o pipefail
          : > p3-jumper-trace.log
          for mode in SPEED MODERN; do
            echo "===== $mode P3 JUMPER =====" | tee -a p3-jumper-trace.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode="$mode"               -DmatrixPattern=3               -DmatrixKit=JUMPER               -DmatrixSpawnMonsters=false               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a p3-jumper-trace.log
          done
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-mob-p3-jumper-trace-${{ github.sha }}
          path: p3-jumper-trace.log
