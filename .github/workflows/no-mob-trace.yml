name: No-mob targeted trace

on:
  workflow_dispatch:
  push:
    branches:
      - autonomous/locomotion-026-v1

concurrency:
  group: monstermaze-no-mob-trace
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Trace Modern P2 Slowballer
        run: |
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=2             -DmatrixKit=SLOWBALLER             -DmatrixSpawnMonsters=false             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test | tee trace.log
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-mob-trace-${{ github.sha }}
          path: trace.log
