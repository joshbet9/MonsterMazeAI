name: P2 BB Candidate Regression Trace

on:
  push:
    branches: [ validation/p2-bb-candidate-trace-20261006 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile common tests
        run: mvn -B -ntp -pl common -am install -DskipTests
      - name: Run diagnostic
        shell: bash
        run: |
          mvn -B -ntp -pl common \
            -DmatrixDiagnostic=true \
            -Dexec.mainClass=me.monstermazeai.sim.NaturalEndMatrixRunner \
            -Dexec.classpathScope=test \
            -Dexec.args="SPEED 2 BODY_BUILDER" \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java 2>&1 | tee cell.log
          grep -E '^(FIRST_FALL|DIAGNOSTIC|FULL_MATRIX|EFFICIENCY) ' cell.log