name: Phase 2 — Deadlock v3 trace

on:
  push:
    branches:
      - phase2-deadlock-v3-trace

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Trace Modern P1 Maverick
        shell: bash
        run: |
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=1             -DmatrixKit=MAVERICK             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test > trace.log 2>&1
          grep -E '^(FIRST_FALL|DIAGNOSTIC)' trace.log > trace-summary.txt || true
          grep -o 'MOB_AVOIDANCE_DEADLOCK[^|]*' trace.log | head -30 || true
          cat trace-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadlock-v3-trace
          path: |
            trace-summary.txt
            trace.log
