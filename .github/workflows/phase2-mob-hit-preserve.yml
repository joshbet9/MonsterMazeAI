name: Phase 2 — Mob-hit route preservation test

on:
  push:
    branches:
      - autonomous/phase2-mob-hit-route-preserve-v1

concurrency:
  group: monstermaze-phase2-mob-hit-preserve
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run Modern BB + weak Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > preserve-route.log
          for kit in BODY_BUILDER JUMPER SLOWBALLER REPULSOR MAVERICK; do
            for pattern in 1 2 3; do
              echo "===== MODERN P$pattern $kit =====" | tee -a preserve-route.log
              mvn -B -ntp -pl common -am \
                -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
                -DmatrixMode=MODERN \
                -DmatrixPattern="$pattern" \
                -DmatrixKit="$kit" \
                -DmatrixSpawnMonsters=true \
                -Dsurefire.failIfNoSpecifiedTests=false \
                -Dsurefire.useFile=false \
                -Dsurefire.redirectTestOutputToFile=false \
                test 2>&1 | tee -a preserve-route.log
            done
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("preserve-route.log").read_text(encoding="utf-8",errors="replace")
          rows=[(m.group(1),int(m.group(2)),m.group(3),int(m.group(4)),int(m.group(5)))
                for m in re.finditer(r"FULL_MATRIX mode=(MODERN) pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=15:
              raise SystemExit(f"expected 15 rows, found {len(rows)}")
          for r in rows: print(r)
          print("mean",sum(r[3] for r in rows)/len(rows))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-mob-hit-preserve-${{ github.sha }}
          path: preserve-route.log
