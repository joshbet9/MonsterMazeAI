name: Phase 2 — Modern Body Builder diagnostics

on:
  push:
    branches:
      - autonomous/phase2-modern-bb-diagnostic-v1

concurrency:
  group: monstermaze-phase2-modern-bb-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run Modern Body Builder diagnostics
        shell: bash
        run: |
          set -o pipefail
          : > modern-bb-diagnostic.log
          for pattern in 1 2 3; do
            echo "===== MODERN P$pattern BODY_BUILDER =====" | tee -a modern-bb-diagnostic.log
            mvn -B -ntp -pl common -am \
              -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
              -DmatrixMode=MODERN \
              -DmatrixPattern="$pattern" \
              -DmatrixKit=BODY_BUILDER \
              -DmatrixSpawnMonsters=true \
              -DmatrixDiagnostic=true \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dsurefire.useFile=false \
              -Dsurefire.redirectTestOutputToFile=false \
              test 2>&1 | tee -a modern-bb-diagnostic.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-bb-diagnostic-${{ github.sha }}
          path: modern-bb-diagnostic.log
