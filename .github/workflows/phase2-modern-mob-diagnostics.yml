name: Phase 2 — Modern mob diagnostic traces

on:
  push:
    branches:
      - phase2-modern-mob-diagnostics-v1

jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run representative Modern traces
        shell: bash
        run: |
          set -o pipefail
          : > diagnostic.log
          for spec in "1 SLOWBALLER" "2 SLOWBALLER" "3 SLOWBALLER" "1 MAVERICK" "2 MAVERICK" "3 MAVERICK"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a diagnostic.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a diagnostic.log
          done
      - name: Extract diagnostic summary
        run: |
          grep -E '^(=====|FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' diagnostic.log > diagnostic-summary.txt || true
          cat diagnostic-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-mob-diagnostics
          path: diagnostic-summary.txt
