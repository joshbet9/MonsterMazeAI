name: Phase 2 — Non-Jumper gap pulse regression

on:
  push:
    branches:
      - autonomous/phase2-nonjump-gap-pulse-v1

concurrency:
  group: monstermaze-phase2-nonjumper-gap-pulse
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run all non-Jumper historical gap cells
        shell: bash
        run: |
          set -o pipefail
          : > gap-pulse.log
          for mode in SPEED MODERN; do
            for kit in SLOWBALLER BODY_BUILDER REPULSOR MAVERICK; do
              for pattern in 1 2 3; do
                echo "===== $mode P$pattern $kit =====" | tee -a gap-pulse.log
                mvn -B -ntp -pl common -am \
                  -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
                  -DmatrixMode="$mode" \
                  -DmatrixPattern="$pattern" \
                  -DmatrixKit="$kit" \
                  -DmatrixSpawnMonsters=true \
                  -Dsurefire.failIfNoSpecifiedTests=false \
                  -Dsurefire.useFile=false \
                  -Dsurefire.redirectTestOutputToFile=false \
                  test 2>&1 | tee -a gap-pulse.log
              done
            done
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("gap-pulse.log").read_text(encoding="utf-8",errors="replace")
          rows=[(m.group(1),int(m.group(2)),m.group(3),int(m.group(4)),int(m.group(5)))
                for m in re.finditer(r"FULL_MATRIX mode=(SPEED|MODERN) pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=24:
              raise SystemExit(f"expected 24 rows, found {len(rows)}")
          for r in rows: print(r)
          speed=[r[3] for r in rows if r[0]=="SPEED"]
          modern=[r[3] for r in rows if r[0]=="MODERN"]
          print("speedMean",sum(speed)/len(speed))
          print("modernMean",sum(modern)/len(modern))
          print("modern>=10",sum(x>=10 for x in modern))
          print("speed>=10",sum(x>=10 for x in speed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-nonjumper-gap-pulse-${{ github.sha }}
          path: gap-pulse.log
