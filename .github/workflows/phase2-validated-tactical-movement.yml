name: Phase 2 — Validated tactical movement Modern regression

on:
  push:
    branches:
      - phase2-validated-tactical-movement-v1

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common-api
        run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run six representative Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > validated-tactical.log
          for spec in "1 SLOWBALLER" "2 SLOWBALLER" "3 SLOWBALLER" "1 MAVERICK" "2 MAVERICK" "3 MAVERICK"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a validated-tactical.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a validated-tactical.log
          done
      - name: Capture compact result
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("validated-tactical.log").read_text(encoding="utf-8",errors="replace")
          rows=[(int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4)))
                for m in re.finditer(r"FULL_MATRIX mode=MODERN pattern=(d+) kit=([A-Z_]+) stage=(d+) ticks=(d+)",t)]
          if len(rows)!=6: raise SystemExit(f"expected 6 rows, got {len(rows)}")
          vals=[r[2] for r in rows]
          lines=[f"Modern P{p} {k} stage={s} ticks={ticks}" for p,k,s,ticks in rows]
          lines += ["",f"Modern representative mean={sum(vals)/len(vals):.4f}",
                    f"Modern >=10={sum(x>=10 for x in vals)}/6"]
          Path("validated-tactical-report.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validated-tactical-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Capture validated tactical movement result [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-tactical
          path: validated-tactical.log
