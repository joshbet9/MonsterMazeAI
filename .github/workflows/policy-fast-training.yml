name: Policy Fast Training CI

on:
  workflow_dispatch:
  push:
    branches: [ feature/policy-fast-training ]

permissions:
  contents: read

jobs:
  policy-fast-training:
    name: Short counterfactual policy rollout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run one short training window
        run: >
          mvn -B -ntp -pl common -am
          -Dtest=PolicyTrainingRolloutTest
          -Dmonstermaze.sim.seedOffset=12345
          -Dmonstermaze.ml.policy.counterfactual=true
          -Dmonstermaze.ml.policy.output=target/policy-fast-training.jsonl
          -Dmonstermaze.ml.policy.counterfactual.stride=40
          -Dmonstermaze.ml.policy.counterfactual.horizon=32
          -Dmonstermaze.ml.policy.counterfactual.gamma=0.995
          -Dmonstermaze.ml.policy.trainingCasesPerMode=3
          -Dmonstermaze.ml.policy.epsilon=0.0
          -Dmonstermaze.ml.policy.explore=false
          -Dsurefire.useFile=false
          -Dsurefire.redirectTestOutputToFile=false
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install policy trainer dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Inspect counterfactual dataset
        run: |
          test -s common/target/policy-fast-training.jsonl
          python ml/policy_data_diagnostic.py --input common/target/policy-fast-training.jsonl

      - name: Train counterfactual policy model
        run: |
          python ml/policy_trainer.py --input common/target/policy-fast-training.jsonl --output common/target/policy-fast-training-model.json --epochs 40 --batch-size 256 --samples-per-epoch 10000 --hidden1 48 --hidden2 24 --learning-rate 0.001 --validation-fraction 0.20 --min-samples 100 --seed 1337 --report-every 10

      - name: Verify trained policy artifact
        run: |
          test -s common/target/policy-fast-training.jsonl
          test -s common/target/policy-fast-training-model.json

      - name: Upload policy learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstermaze-policy-fast-${{ github.sha }}
          path: |
            common/target/policy-fast-training.jsonl
            common/target/policy-fast-training-model.json
            common/target/surefire-reports/*.txt
            common/target/surefire-reports/*.xml
          if-no-files-found: warn
