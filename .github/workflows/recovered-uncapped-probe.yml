name: Recovered High-Performance Uncapped Probe

on:
  push:
    branches: [ validation/recovered-high-performance-uncapped-probe ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {mode: SPEED, pattern: 2, kit: BODY_BUILDER}
          - {mode: SPEED, pattern: 2, kit: MAVERICK}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    name: ${{ matrix.mode }} P${{ matrix.pattern }} ${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile common tests
        run: mvn -B -ntp -pl common -am install -DskipTests
      - name: Run uncapped cell
        shell: bash
        run: |
          mvn -B -ntp -pl common \
            -Dexec.mainClass=me.monstermazeai.sim.NaturalEndMatrixRunner \
            -Dexec.classpathScope=test \
            -Dexec.args="${{ matrix.mode }} ${{ matrix.pattern }} ${{ matrix.kit }}" \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:java 2>&1 | tee cell.log
          grep '^FULL_MATRIX ' cell.log

# trigger probe rerun
