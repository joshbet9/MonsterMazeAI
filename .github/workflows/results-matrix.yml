name: Results Matrix Calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'calibration/results-matrix-*'

permissions:
  contents: read

concurrency:
  group: monstermaze-ml-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Baseline + ML-prefilter 15 Speed + 15 Modern matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare ML output directory
        run: |
          mkdir -p ml-data
          : > ml-data/route-training.jsonl

      - name: Run baseline matrix and collect simulator labels
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am \
            -Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest \
            -Dmonstermaze.ml.record=true \
            -Dmonstermaze.ml.output=ml-data/route-training.jsonl \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee ml-data/baseline-matrix.log


      - name: Set up Python 3
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML trainer dependency
        if: always()
        run: python -m pip install --disable-pip-version-check numpy

      - name: Inspect simulator training set
        if: always()
        continue-on-error: true
        run: python ml/route_ranker.py inspect --input ml-data/route-training.jsonl

      - name: Train route-value model
        if: always()
        continue-on-error: true
        run: >
          python ml/route_ranker.py train
          --input ml-data/route-training.jsonl
          --output ml-data/route-value-model.json
          --epochs 250
          --batch-size 256
          --hidden1 32
          --hidden2 16
          --learning-rate 0.002
          --validation-fraction 0.20
          --min-samples 100
          --seed 1337

      - name: Run ML-prefilter matrix
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          if [ ! -s ml-data/route-value-model.json ]; then
            echo "No trained model; skipping ML-prefilter matrix"
            exit 0
          fi
          mvn -B -ntp -pl common -am \
            -Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest \
            -Dmonstermaze.ml.record=false \
            -Dmonstermaze.ml.model=ml-data/route-value-model.json \
            -Dmonstermaze.ml.mode=prefilter \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test 2>&1 | tee ml-data/prefilter-matrix.log

      - name: Compare baseline and ML-prefilter matrix
        if: always()
        continue-on-error: true
        run: |
          if [ -s ml-data/baseline-matrix.log ] && [ -s ml-data/prefilter-matrix.log ]; then
            python ml/compare_matrix.py \
              --baseline ml-data/baseline-matrix.log \
              --ml ml-data/prefilter-matrix.log
          else
            echo "Baseline or ML-prefilter log is unavailable"
          fi

      - name: Upload ML dataset and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monstermaze-route-ml-${{ github.sha }}
          path: |
            ml-data/route-training.jsonl
            ml-data/route-value-model.json
          if-no-files-found: warn
