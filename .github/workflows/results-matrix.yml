name: Results Matrix Calibration

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'calibration/results-matrix-*'

permissions:
  contents: read

jobs:
  matrix:
    name: 15 Speed + 15 Modern natural-termination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run full results matrix
        run: >
          mvn -B -ntp -pl common -am
          -Dtest=SpeedFullRunDiagnosticTest,ModernFullRunDiagnosticTest
          -Dsurefire.useFile=false
          -Dsurefire.redirectTestOutputToFile=false
          -Dsurefire.failIfNoSpecifiedTests=false
          test
