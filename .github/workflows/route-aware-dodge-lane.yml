name: Experiment — route-aware dodge lane

on:
  push:
    branches:
      - experiment/route-aware-dodge-lane-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run mixed cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=RouteAwareDodgeLaneIT#mixedCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee route-aware-lane.log
          grep -E '^(LANE_MATRIX|LANE_MEAN)' route-aware-lane.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-aware-lane
          path: route-aware-lane.log
