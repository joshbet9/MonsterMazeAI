name: Same Seed Cross Pattern

on:
  push:
    branches: [ validation/pattern-same-seed-20261006 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pattern: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    name: SPEED P${{ matrix.pattern }} MAVERICK same-seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile common tests
        run: mvn -B -ntp -pl common -am install -DskipTests
      - name: Run same-seed natural-end cell
        shell: bash
        run: |
          mvn -B -ntp -pl common \
            -DmatrixMode=SPEED \
            -DmatrixPattern=${{ matrix.pattern }} \
            -DmatrixKit=MAVERICK \
            -DmatrixSeed=305419896 \
            -DmatrixSpawnMonsters=true \
            -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsurefire.useFile=false \
            -Dsurefire.redirectTestOutputToFile=false \
            test