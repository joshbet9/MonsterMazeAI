name: Experiment — single gap owner P1 Maverick diagnostic

on:
  push:
    branches:
      - experiment/stale-gap-edge-horizon-single-gap-owner-v1

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -pl common-api -am -DskipTests install
      - name: Run P1 Maverick
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase             -DmatrixMode=MODERN             -DmatrixPattern=1             -DmatrixKit=MAVERICK             -DmatrixSpawnMonsters=true             -DmatrixDiagnostic=true             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee single-gap.log
      - name: Extract summary
        run: |
          grep -E '^(FULL_MATRIX|FIRST_FALL|DIAGNOSTIC)' single-gap.log > single-gap-summary.txt || true
          cat single-gap-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-gap-p1-maverick
          path: single-gap-summary.txt
