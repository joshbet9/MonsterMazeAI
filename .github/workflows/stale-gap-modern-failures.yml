name: Diagnostic — stale-gap Modern failure traces

on:
  push:
    branches:
      - diagnostic/stale-gap-modern-failures-v1

permissions:
  contents: read

jobs:
  traces:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run representative failure traces
        shell: bash
        run: |
          set -o pipefail
          : > trace.log
          for spec in "1 SLOWBALLER" "1 REPULSOR" "2 REPULSOR" "3 REPULSOR" "1 JUMPER"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a trace.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -DmatrixDiagnostic=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a trace.log
          done
      - name: Extract useful traces
        run: |
          grep -E '^(=====|FULL_MATRIX|EFFICIENCY|FIRST_FALL|DIAGNOSTIC|MOB_|GAP_|ABILITY_|ROUTE_)' trace.log > trace-summary.txt || true
          cat trace-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stale-gap-modern-traces
          path: trace-summary.txt
