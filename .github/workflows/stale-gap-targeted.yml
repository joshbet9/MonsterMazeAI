name: Experiment — stale gap commitment cancellation
on:
  push:
    branches:
      - experiment/gap-commitment-stale-cancel-v1
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run targeted Speed and Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > stale-gap.log
          for spec in             "MODERN 1 SLOWBALLER" "MODERN 2 MAVERICK" "MODERN 1 BODY_BUILDER"             "MODERN 2 BODY_BUILDER" "MODERN 3 BODY_BUILDER" "MODERN 3 MAVERICK"             "SPEED 1 SLOWBALLER" "SPEED 2 MAVERICK" "SPEED 3 BODY_BUILDER"; do
            set -- $spec
            echo "===== $1 P$2 $3 =====" | tee -a stale-gap.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode="$1"               -DmatrixPattern="$2"               -DmatrixKit="$3"               -DmatrixSpawnMonsters=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a stale-gap.log
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("stale-gap.log").read_text(encoding="utf-8",errors="replace")
          rows=[(m.group(1),int(m.group(2)),m.group(3),int(m.group(4)),int(m.group(5)))
                for m in re.finditer(r"FULL_MATRIX mode=(SPEED|MODERN) pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=9: raise SystemExit(f"expected 9 rows, got {len(rows)}")
          for r in rows: print(f"{r[0]} P{r[1]} {r[2]} stage={r[3]} ticks={r[4]}")
          for mode in ("SPEED","MODERN"):
            vals=[r[3] for r in rows if r[0]==mode]
            print(f"{mode} mean={sum(vals)/len(vals):.4f}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stale-gap-targeted
          path: stale-gap.log
