name: Experiment — current-waypoint tactical-first

on:
  push:
    branches:
      - experiment/current-waypoint-tactical-first-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run six difficult Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > tactical-first.log
          for spec in "1 MAVERICK" "2 BODY_BUILDER" "2 MAVERICK" "3 JUMPER" "3 REPULSOR" "3 MAVERICK"; do
            set -- $spec
            pattern=$1
            kit=$2
            echo "===== MODERN P$pattern $kit =====" | tee -a tactical-first.log
            mvn -B -ntp -pl common -am               -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase               -DmatrixMode=MODERN               -DmatrixPattern="$pattern"               -DmatrixKit="$kit"               -DmatrixSpawnMonsters=true               -Dsurefire.failIfNoSpecifiedTests=false               -Dsurefire.useFile=false               -Dsurefire.redirectTestOutputToFile=false               test 2>&1 | tee -a tactical-first.log
          done
      - name: Capture
        run: |
          grep -E '^FULL_MATRIX' tactical-first.log
