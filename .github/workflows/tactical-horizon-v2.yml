name: Experiment — longer tactical horizon v2
on:
  push:
    branches:
      - experiment/mob-tactical-horizon-v2
permissions:
  contents: read
jobs:
  modern:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run 15 Modern cells
        shell: bash
        run: |
          set -o pipefail
          : > horizon.log
          for pattern in 1 2 3; do
            for kit in JUMPER SLOWBALLER BODY_BUILDER REPULSOR MAVERICK; do
              echo "===== MODERN P$pattern $kit =====" | tee -a horizon.log
              mvn -B -ntp -pl common -am                 -Dtest=NaturalTerminationMatrixIT#naturalTerminationCase                 -DmatrixMode=MODERN                 -DmatrixPattern="$pattern"                 -DmatrixKit="$kit"                 -DmatrixSpawnMonsters=true                 -Dsurefire.failIfNoSpecifiedTests=false                 -Dsurefire.useFile=false                 -Dsurefire.redirectTestOutputToFile=false                 test 2>&1 | tee -a horizon.log
            done
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          t=Path("horizon.log").read_text(encoding="utf-8",errors="replace")
          rows=[(int(m.group(1)),m.group(2),int(m.group(3)),int(m.group(4)))
                for m in re.finditer(r"FULL_MATRIX mode=MODERN pattern=(\d+) kit=([A-Z_]+) stage=(\d+) ticks=(\d+)",t)]
          if len(rows)!=15: raise SystemExit(f"expected 15 rows, got {len(rows)}")
          vals=[x[2] for x in rows]
          print(f"Modern mean={sum(vals)/len(vals):.4f} min={min(vals)} max={max(vals)} >=10={sum(v>=10 for v in vals)}/15 >=40={sum(v>=40 for v in vals)}/15")
          for p,k,s,ticks in rows: print(f"Modern P{p} {k} stage={s} ticks={ticks}")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-horizon-v2
          path: horizon.log
