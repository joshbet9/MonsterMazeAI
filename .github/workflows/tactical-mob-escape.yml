name: Experiment — tactical mob escape

on:
  push:
    branches:
      - experiment/tactical-mob-escape-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run difficult cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=TacticalMobEscapeIT#difficultCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee tactical-escape.log
          grep -E '^(TACTESC_MATRIX|TACTESC_MEAN)' tactical-escape.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-mob-escape
          path: tactical-escape.log
