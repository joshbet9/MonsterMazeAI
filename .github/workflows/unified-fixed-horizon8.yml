name: Experiment — unified fixed horizon 8

on:
  push:
    branches:
      - experiment/unified-fixed-horizon8-v1

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run mixed cells
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp -pl common -am             -Dtest=UnifiedFixedHorizon8IT#mixedWeakAndStrongCells             -Dsurefire.failIfNoSpecifiedTests=false             -Dsurefire.useFile=false             -Dsurefire.redirectTestOutputToFile=false             test 2>&1 | tee fix8.log
          grep -E '^(FIX8_MATRIX|FIX8_MEAN)' fix8.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-fix8
          path: fix8.log
