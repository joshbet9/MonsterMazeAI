buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "0.1.0-SNAPSHOT"
group = "me.monstermazeai"
archivesBaseName = "monster-maze-ai-1.8"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"
compileJava {
    options.fork = true
    def java17Home = System.getenv("JAVA_HOME_17_X64")
    if (java17Home != null) {
        options.forkOptions.executable = new File(java17Home, "bin/javac").absolutePath
    }
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

def gitRevision = "unknown"
try {
    def proc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir)
    proc.waitFor()
    def detected = proc.in.text.trim()
    if (detected) gitRevision = detected
} catch (Exception ignored) {
}

def commonApiJar = file("../common-api/target/common-api-0.1.0-SNAPSHOT.jar")
def commonRuntimeJar = file("../common/target/common-0.1.0-SNAPSHOT-runtime.jar")

dependencies {
    compile files(commonApiJar)
    testCompile "junit:junit:4.13.2"
    // The deterministic simulator tests exercise the Java-17 common mechanics,
    // but remain test-only so the Forge production adapter stays Java-8/API-only.
    testCompile files(commonRuntimeJar)

// Keep the deterministic maze progression simulator visible in CI logs.\ntestLogging {\n    showStandardStreams = true\n    exceptionFormat = "full"\n}
}

runClient {
    systemProperty "monstermazeai.version", gitRevision
}

task verifyCommonRuntime {
    doLast {
        if (!commonRuntimeJar.isFile()) {
            throw new GradleException(
                    "Missing common runtime sidecar: " + commonRuntimeJar.absolutePath
                    + ". Build the Java-17 common module first with: mvn -B -ntp -pl common -am package"
            )
        }
    }
}

jar {
    dependsOn verifyCommonRuntime

    // Forge loads the adapter as a single mod JAR. Package the tiny Java-8
    // common API inside it so runtime classes such as Kit are available.
    from zipTree(commonApiJar)

    // Also carry the Java-17 sidecar inside the mod. The Java-8 adapter never
    // loads these classes; Minecraft18AiRuntime extracts this nested JAR and
    // launches it with Java 17. This removes the fragile dependency on a
    // developer-specific environment variable or working directory.
    from(commonRuntimeJar) {
        into "runtime"
        rename { "monster-maze-ai-runtime.jar" }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}


// Simulator tests consume the Java-17 common runtime. Keep this dependency
// completely out of the Forge production classpath and run/compile those tests
// with the same Java level as the common module.
compileTestJava {
    options.fork = true
    def java17Home = System.getenv("JAVA_HOME_17_X64")
    if (java17Home != null) {
        options.forkOptions.executable = new File(java17Home, "bin/javac").absolutePath
    }
}

// Gradle 2.14.1 cannot determine a modern Java runtime version reliably.
// Keep the normal Forge/JUnit suite on Java 8 and execute the simulator gate
// explicitly with Java 17 after testClasses so Java-17 common classes can run.
test {
    exclude "**/MazePatternStage10SimulationTest.class"
}

task simulatorGate(type: Exec) {
    dependsOn testClasses
    doFirst {
        def java17Home = System.getenv("JAVA_HOME_17_X64")
        if (java17Home == null) {
            throw new GradleException("JAVA_HOME_17_X64 is required for the Java-17 simulator gate")
        }
        commandLine new File(java17Home, "bin/java").absolutePath,
                "-cp", sourceSets.test.runtimeClasspath.asPath,
                "org.junit.runner.JUnitCore",
                "me.monstermazeai.minecraft.v18.MazePatternStage10SimulationTest"
    }
}

check.dependsOn simulatorGate
