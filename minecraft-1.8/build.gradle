buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "0.1.0-SNAPSHOT"
group = "me.monstermazeai"
archivesBaseName = "monster-maze-ai-1.8"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

// ForgeGradle 2.1 generates the patched Forge binary locally. The exact
// cache filename/layout is not stable across ForgeGradle patch revisions,
// so locate the generated forgeBin jar instead of hard-coding its name.
def forgeBinFiles = fileTree(gradle.gradleUserHomeDir) {
    include "caches/minecraft/**/forgeBin*.jar"
}

compileJava.classpath += files(forgeBinFiles)
compileJava.dependsOn "mergeJars"

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
