buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "0.1.0-SNAPSHOT"
group = "me.monstermazeai"
archivesBaseName = "monster-maze-ai-1.8"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"
compileJava {
    options.fork = true
    def java17Home = System.getenv("JAVA_HOME_17_X64")
    if (java17Home != null) {
        options.forkOptions.executable = new File(java17Home, "bin/javac").absolutePath
    }
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

def commonApiJar = file("../common-api/target/common-api-0.1.0-SNAPSHOT.jar")

dependencies {
    compile files(commonApiJar)
    testCompile "junit:junit:4.13.2"
}

jar {
    // Forge loads the adapter as a single mod JAR. Package the tiny Java-8
    // common API inside it so runtime classes such as Kit are available.
    from zipTree(commonApiJar)
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
