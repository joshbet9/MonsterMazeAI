buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "0.1.0-SNAPSHOT"
group = "me.monstermazeai"
archivesBaseName = "monster-maze-ai-1.8"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = "UTF-8"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
}

dependencies {
    // ForgeGradle 2.1 generates the patched Forge binary locally.  The
    // generated forgeBin is the authoritative Java-8 compile classpath for
    // FML/Forge APIs; the remote userdev artifact is only workspace input.
    compile fileTree(dir: "$buildDir/dirtyArtifacts", include: "*.jar")
}

compileJava.dependsOn "mergeJars"

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
